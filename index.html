<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echecs</title>
    <link rel="icon" href="lib/chessboard/img/bK.svg">
    <link rel="stylesheet" href="lib/sumi.css/index.css">
    <link rel="stylesheet" href="lib/chessboard/styles.css">
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
      {
        "imports": {
          "jquery": "./lib/jquery/index.js",
          "chessboard": "./lib/chessboard/index.js",
          "chess.js": "./lib/chess.js/index.js",
          "confetti": "./lib/confetti/index.js"
        }
      }
    </script>
    <script src="src/index.js" type="module"></script>
  </head>
  <body>
    <main>
      <div id="board"></div>
      <section id="controls">
        <button id="newgame">Nouvelle partie</button>
        <br>
        <button id="flip" class="outline">Retourner l'échiquier</button>
        <div id="stockfish-eval"></div>
      </section>
    </main>
    <dialog id="newgame-config">
      <article>
        <header>
          <h3>Nouvelle partie</h3>
        </header>
        <form>
          <fieldset>
            <legend>Nombre de joueurs</legend>
            <label>
              <input type="radio" name="nbPlayers" checked value="1">
              1 joueur
            </label>
            <label>
              <input type="radio" name="nbPlayers" value="2">
              2 joueurs
            </label>
          </fieldset>
          <div id="onePlayerChoices">
            <fieldset>
              <legend>Couleur</legend>
              <label>
              <input type="radio" name="color" checked value="white">
                blancs
              </label>
              <label>
                <input type="radio" name="color" value="black">
                noirs
              </label>
            </fieldset>
            <fieldset>
              <label for="elo">
                Niveau de l'ordinateur
              </label>
              <div id="elo-range">
                <span>1320</span>
                <input type="range" name="elo" min="1320" max="3190" step="10" id="elo" value="1500"/>
                <span>3190</span>
              </div>
              <div id="elo-value">
                1500 ELO
              </div>
            </fieldset>
          </div>
          <footer>
            <input type="reset" value="Annuler" class="outline"/>
            <input type="submit" value="Commencer"/>
          </footer>
        </form>
      </article>
    </dialog>
    <footer>
      Fait avec amour par Yannick. Pièces par <a href="//commons.wikimedia.org/wiki/User:Cburnett" title="User:Cburnett">Cburnett</a>.
    </footer>
  </body>
</html>
